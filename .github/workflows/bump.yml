name: bump formulas

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump to latest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/bump.sh
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then echo "nothing to bump"; exit 0; fi
          git commit -m "bump: $(git diff --cached --name-only | xargs -n1 basename | sed 's/\.rb$//' | paste -sd, -)"
          git push
